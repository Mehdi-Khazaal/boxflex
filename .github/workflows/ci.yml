name: CI

on:
  push:
  pull_request:

jobs:
  build-test-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: alire-project/setup-alire@v4

      - name: Build library
        run: alr -n build

      - name: Tests
        run: |
          cd tests
          alr -n build
          ./bin/tests

      - name: Showcase
        run: |
          cd showcase
          alr -n build
          alr -n run

      - name: Upload showcase.svg
        uses: actions/upload-artifact@v4
        with:
          name: showcase
          path: showcase/showcase.svg

      - name: SPARK flow analysis
        run: |
          alr -n with gnatprove
          alr -n exec -- gnatprove -P boxflex.gpr --mode=flow --checks-as-errors=on

      # Full proof is not gated yet. Locally:
      #   alr with gnatprove
      #   alr exec -- gnatprove -P boxflex.gpr --mode=all
      # Make it a required step once Boxflex.Geometry proves clean.
